name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build app
        run: dotnet build JxTerminal.csproj -c Release --nologo

      - name: Run unit tests
        run: dotnet test tests/JxTerminal.Tests/JxTerminal.Tests.csproj -c Release --nologo
