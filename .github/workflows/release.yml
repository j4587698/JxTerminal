name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v0.1.0)'
        required: false
        default: 'v0.1.0'

permissions:
  contents: write

jobs:
  build-aot:
    name: Build Native AOT (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-x64
            os: windows-latest
            rid: win-x64
            archive_name: JxTerminal-windows-x64.zip
          - target: linux-x64
            os: ubuntu-latest
            rid: linux-x64
            archive_name: JxTerminal-linux-x64.tar.gz
          - target: macos-arm64
            os: macos-latest
            rid: osx-arm64
            archive_name: JxTerminal-macos-arm64.tar.gz
          - target: macos-x64
            os: macos-latest
            rid: osx-x64
            archive_name: JxTerminal-macos-x64.tar.gz

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install Linux Native AOT dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang \
            zlib1g-dev \
            libfontconfig1-dev \
            libice-dev \
            libsm-dev \
            libx11-dev \
            libx11-xcb-dev \
            libxcursor-dev \
            libxi-dev \
            libxrandr-dev

      - name: Publish Native AOT
        run: |
          dotnet publish JxTerminal.csproj \
            -c Release \
            -r ${{ matrix.rid }} \
            -p:PublishAot=true \
            -p:StripSymbols=true \
            -o ./publish

      - name: Package Windows Artifact
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path ./publish/* -DestinationPath ${{ matrix.archive_name }}

      - name: Package Unix Artifact
        if: runner.os != 'Windows'
        shell: bash
        run: |
          chmod +x ./publish/JxTerminal
          tar -czvf ${{ matrix.archive_name }} -C ./publish .

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: ${{ matrix.archive_name }}
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    needs: build-aot
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts
          merge-multiple: true

      - name: Determine Release Tag
        id: release_tag
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.tag_name }}" ]; then
            echo "tag=${{ github.event.inputs.tag_name }}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "tag=v0.1.0" >> $GITHUB_OUTPUT
          fi

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          name: JxTerminal ${{ steps.release_tag.outputs.tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            ./artifacts/*.zip
            ./artifacts/*.tar.gz
